; DEV MODE ONLY (draft preview). Password-protected app without SSO identity:
; the developer acts as a fixed HQ user. Never used by the production app.
[program:app]
command=uv run --no-dev streamlit run /app/app.py --server.port 8501 --server.address 127.0.0.1 --server.headless true --server.runOnSave true
directory=/app
environment=APP_DEV_USER="matej.loub@embedit.com",APP_DEV_ROLE="HQ"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
