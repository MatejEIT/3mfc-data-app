; TEMPORARY (pre-release): the app is protected by a shared password only, which carries no user
; identity, so every visitor acts as this HQ developer. MUST be removed when OIDC/SSO is configured,
; before entities or HQ users get access (see docs/ARCHITECTURE.md › Security).
[program:app]
command=uv run --no-dev streamlit run /app/app.py --server.port 8501 --server.address 127.0.0.1 --server.headless true
directory=/app
environment=APP_DEV_USER="matej.loub@embedit.com",APP_DEV_ROLE="HQ"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
