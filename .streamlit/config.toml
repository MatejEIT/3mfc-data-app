[theme]
base = "light"
primaryColor = "#1E90FF"
backgroundColor = "#F7F9FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#222529"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
